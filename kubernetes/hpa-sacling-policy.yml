apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: resource-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: resource-demo
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50

  behavior:
    scaleUp: # allows up to 2 additional Pods per 60-second policy period, or a 100% increase, whichever permits the larger change.
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max
    scaleDown: # uses a 300-second stabilization window and limits removal to 1 Pod per 60-second policy period
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Max
