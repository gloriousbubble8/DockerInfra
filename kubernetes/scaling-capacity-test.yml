apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaling-capacity-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaling-capacity-test
  template:
    metadata:
      labels:
        app: scaling-capacity-test
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 20"]
          resources:
            requests:
              memory: "5Gi"
