apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-deleter-test
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-deleter-test-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: pod-viewer
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-deleter-test
