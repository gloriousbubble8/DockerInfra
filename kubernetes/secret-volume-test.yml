apiVersion: v1
kind: Pod
metadata:
  name: secret-volume-test
  namespace: default
spec:
  containers:
    - name: test
      image: busybox:1.37
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: db-credentials
          mountPath: /etc/db-credentials
          readOnly: true

  volumes:
    - name: db-credentials
      secret:
        secretName: product-db-secret
